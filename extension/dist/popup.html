<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Job Tracker</title>
    <style>
      body {
        width: 300px;
        font-family: system-ui, sans-serif;
        padding: 12px;
        margin: 0;
        color: #1e293b;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      label {
        font-size: 11px;
        font-weight: 600;
        color: #475569;
        display: block;
        margin-top: 8px;
      }
      input,
      select,
      textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
        font-size: 12px;
        border: 1px solid #cbd5e1;
        border-radius: 4px;
        margin-top: 2px;
      }
      button {
        width: 100%;
        margin-top: 12px;
        padding: 8px;
        background: #0f172a;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      #status {
        font-size: 11px;
        margin-top: 8px;
      }
      #loginForm,
      #jobForm {
        display: none;
      }
      a {
        color: #0f172a;
      }
    </style>
  </head>
  <body>
    <h1>Job Tracker</h1>

    <div id="loginForm">
      <label>Email</label>
      <input id="email" type="email" />
      <label>Password</label>
      <input id="password" type="password" />
      <button id="loginBtn">Log in</button>
      <p style="font-size: 11px; margin-top: 8px;">
        No account? Register in the
        <a href="http://localhost:5173/register" target="_blank">dashboard app</a>.
      </p>
    </div>

    <div id="jobForm">
      <label>Company</label>
      <input id="company" />
      <label>Job title</label>
      <input id="title" />
      <label>Location</label>
      <input id="location" />
      <label>Status</label>
      <select id="statusSelect">
        <option value="saved">Saved</option>
        <option value="applied">Applied</option>
        <option value="interviewing">Interviewing</option>
        <option value="offer">Offer</option>
        <option value="rejected">Rejected</option>
      </select>
      <label>Notes</label>
      <textarea id="notes" rows="2"></textarea>
      <button id="saveBtn">Save this job</button>
      <button id="logoutBtn" style="background: transparent; color: #64748b; margin-top: 6px;">
        Log out
      </button>
    </div>

    <p id="statusMessage"></p>

    <script src="popup.js" type="module"></script>
  </body>
</html>
